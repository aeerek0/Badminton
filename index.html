<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จับคู่ตีแบด</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7683;--pr:#0f9d58;--pr2:#e6f5ec;--bd:#dde2e8;--dg:#d93025}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12171c;--card:#1b222a;--tx:#e8edf2;--mu:#8e9aa7;--pr:#34c477;--pr2:#16301f;--bd:#2a333d;--dg:#f28b82}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12171c;--card:#1b222a;--tx:#e8edf2;--mu:#8e9aa7;--pr:#34c477;--pr2:#16301f;--bd:#2a333d;--dg:#f28b82}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai",system-ui,-apple-system,"Sarabun",sans-serif;font-size:16px;padding-bottom:80px}
.wrap{max-width:520px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 12px}
select{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--pr);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--pr2);color:var(--pr)}
button.dg{background:transparent;color:var(--dg);padding:6px 10px}
button.big{width:100%;padding:14px;font-size:17px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 4px}
.nav button.on{color:var(--pr);box-shadow:inset 0 2px 0 var(--pr)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.pl:last-child{border:0}
.badge{background:var(--pr2);color:var(--pr);border-radius:20px;padding:2px 10px;font-size:14px;font-weight:600}
.mu{color:var(--mu);font-size:14px}
.m{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-weight:600}
.vs span.v{color:var(--mu);font-weight:400;font-size:13px}
.lab{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:6px;margin-top:6px}.seg button{flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.tot{font-size:26px;font-weight:700;color:var(--pr)}
.paid{opacity:.5;text-decoration:line-through}
</style>
</head>
<body>
<div class="wrap"><h1>🏸 จับคู่ตีแบด</h1><div id="app"></div></div>
<div class="nav" id="nav"></div>
<script>
var S={players:[],roster:[],off:{},rules:[{a:'อี๋',b:'ปลาย',t:'nopair'},{a:'หมู',b:'ปลาย',t:'never'}],rounds:[],courts:1,tab:0,court:{price:100,hours:2,fixed:''},shuttle:{price:58,count:6},mode:'games',paid:{}};
try{var sv=localStorage.getItem('bdm');if(sv){S=Object.assign(S,JSON.parse(sv));}}catch(e){}
S.rules=[{a:'อี๋',b:'ปลาย',t:'nopair'},{a:'หมู',b:'ปลาย',t:'never'}];
if(!S.roster.length&&S.players.length)S.roster=S.players.slice();
if(S.v!==2){S.court.price=100;S.court.fixed='';S.shuttle.price=58;S.v=2}
if(!S.seeded){['ออม','ศีล','อาร์ม','พลัส','ออย','เจเจ','อั้ม','หมู','ปลาย','อี๋','คุณกร'].forEach(function(n){var k=function(s){return s.replace(/[\s\u0e48-\u0e4b]/g,'')};if(!S.roster.some(function(x){return k(x)===k(n)})){S.roster.push(n);S.off[n]=1}});S.seeded=1}
function act(){return S.roster.filter(function(n){return!S.off[n]})}
function toast(t){var d=document.getElementById('toast');if(!d){d=document.createElement('div');d.id='toast';d.style.cssText='position:fixed;left:12px;right:12px;bottom:80px;max-width:496px;margin:auto;background:#1b2430;color:#fff;padding:12px 14px;border-radius:12px;z-index:9;text-align:center';document.body.appendChild(d)}d.textContent=t;d.style.display='block';clearTimeout(d.t);d.t=setTimeout(function(){d.style.display='none'},3000)}
var cf=0,cn=0;function clr(){if(!cf){cf=1;toast('กดล้างอีกครั้งเพื่อยืนยัน');setTimeout(function(){cf=0},3000);return}cf=0;S.rounds=[];S.paid={};save();render()}
function nd(){if(!cn){cn=1;toast('กดอีกครั้งเพื่อเริ่มวันใหม่ (ล้างรอบและค่าใช้จ่าย เก็บรายชื่อไว้)');setTimeout(function(){cn=0},3000);return}cn=0;S.rounds=[];S.paid={};S.roster.forEach(function(n){S.off[n]=1});save();render()}
function tog(i){var n=S.roster[i];if(S.off[n])delete S.off[n];else S.off[n]=1;save();render()}
function save(){try{localStorage.setItem('bdm',JSON.stringify(S));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function stats(){var g={},p={},o={},last={};S.rounds.forEach(function(r,i){r.matches.forEach(function(m){m.a.concat(m.b).forEach(function(n){g[n]=(g[n]||0)+1;last[n]=i});[m.a,m.b].forEach(function(t){var k=t.slice().sort().join('|');p[k]=(p[k]||0)+1});m.a.forEach(function(x){m.b.forEach(function(y){var k=[x,y].sort().join('|');o[k]=(o[k]||0)+1})})})});return{g:g,p:p,o:o,last:last}}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function key(a,b){return[a,b].sort().join('|')}
function m(p,n){var f=function(s){return s.replace(/[\s\u0e48-\u0e4b]/g,'')};return f(n).indexOf(f(p))>=0}
function bad(x,y,t){return S.rules.some(function(r){return(r.t===t||(t==='nopair'&&r.t==='never'))&&((m(r.a,x)&&m(r.b,y))||(m(r.a,y)&&m(r.b,x)))})}
function bestSplit(q,st){var sp=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]],best=null;sp.forEach(function(s){var a=[q[s[0][0]],q[s[0][1]]],b=[q[s[1][0]],q[s[1][1]]];var c=4*((st.p[key(a[0],a[1])]||0)+(st.p[key(b[0],b[1])]||0));if(bad(a[0],a[1],'nopair')||bad(b[0],b[1],'nopair'))c+=100000;a.forEach(function(x){b.forEach(function(y){c+=st.o[key(x,y)]||0})});if(!best||c<best.c)best={c:c,a:a,b:b}});return best}
function gen(re){var n=act().length;if(n<4){toast('ต้องมีผู้เล่นอย่างน้อย 4 คน');return}
if(re&&S.rounds.length)S.rounds.pop();var st=stats(),courts=Math.min(S.courts,Math.floor(n/4)),need=courts*4;
var order=shuf(act()).sort(function(a,b){var d=(st.g[a]||0)-(st.g[b]||0);if(d)return d;return(st.last[a]===undefined?-1:st.last[a])-(st.last[b]===undefined?-1:st.last[b])});
var base=order.slice(0,need),best=null;function sg(l){var s=0;l.forEach(function(n){s+=st.g[n]||0});return s}var bg=sg(base);
for(var t=0;t<400;t++){var sl=base,rs=order.slice(need),pen=0;if(t>=100){var o2=order.map(function(n){return{n:n,k:(st.g[n]||0)+Math.random()*2}}).sort(function(a,b){return a.k-b.k}).map(function(x){return x.n});sl=o2.slice(0,need);rs=o2.slice(need);pen=(sg(sl)-bg)*30}var sh=shuf(sl),ms=[],tot=pen;for(var c=0;c<courts;c++){var q=sh.slice(c*4,c*4+4),r=bestSplit(q,st);tot+=r.c;for(var i=0;i<4;i++)for(var j=i+1;j<4;j++)if(bad(q[i],q[j],'never'))tot+=100000;ms.push({a:r.a,b:r.b})}if(!best||tot<best.tot)best={tot:tot,ms:ms,rest:rs};if(tot===0)break}
if(best.tot>=100000)toast('จำนวนผู้เล่นน้อยเกินไป จัดคู่ให้ลงตัวไม่ได้ในรอบนี้');S.rounds.push({matches:best.ms,rest:best.rest});save();render()}
function addP(){var el=document.getElementById('nm');var raw=el.value.split(/[,\n]+/);raw.forEach(function(v){v=v.trim();if(v&&S.roster.indexOf(v)<0){S.roster.push(v);delete S.off[v]}});el.value='';save();render()}
function rm(i){delete S.off[S.roster[i]];S.roster.splice(i,1);save();render()}
function allNames(){var s=stats(),u=act();Object.keys(s.g).forEach(function(n){if(u.indexOf(n)<0)u.push(n)});return u}
function num(v){v=parseFloat(v);return isNaN(v)?0:v}
function rulesHtml(){var op=S.roster.map(function(n){return'<option>'+esc(n)+'</option>'}).join('');var h='<div class="card"><b>เงื่อนไขจับคู่</b>';if(!S.rules.length)h+='<p class="mu">ยังไม่มีเงื่อนไข</p>';S.rules.forEach(function(r,i){h+='<div class="pl"><span>'+esc(r.a)+' · '+esc(r.b)+' <span class="mu">'+(r.t==='never'?'ไม่เจอกันเลย':'ไม่เป็นคู่กัน')+'</span></span><button class="dg" onclick="S.rules.splice('+i+',1);save();render()">ลบ</button></div>'});return h+'<div class="g2" style="margin-top:10px"><select id="r1">'+op+'</select><select id="r2">'+op+'</select></div><div class="row" style="margin-top:8px"><select id="rt"><option value="nopair">ไม่เป็นคู่กัน</option><option value="never">ไม่เจอกันเลย</option></select><button onclick="addRule()">เพิ่ม</button></div></div>'}
function addRule(){var a=document.getElementById('r1').value,b=document.getElementById('r2').value;if(!a||!b||a===b)return;S.rules.push({a:a,b:b,t:document.getElementById('rt').value});save();render()}
function tabPlayers(){var st=stats();var h='<div class="card"><div class="row"><input id="nm" placeholder="เพิ่มชื่อใหม่ (คั่นด้วย , ได้)" onkeydown="if(event.key===\'Enter\')addP()"><button onclick="addP()">เพิ่ม</button></div></div><div class="card"><b>รายชื่อประจำ · มาวันนี้ '+act().length+'/'+S.roster.length+' คน</b><p class="mu" style="margin:4px 0">ติ๊กเฉพาะคนที่มาวันนี้ ส่วนคนที่ไม่มาให้เอาติ๊กออก</p><div class="row" style="margin:6px 0"><button class="sec" onclick="S.off={};save();render()">มาครบทุกคน</button><button class="sec" onclick="S.roster.forEach(function(n){S.off[n]=1});save();render()">ยกเลิกทั้งหมด</button><button class="sec" onclick="nd()">เริ่มวันใหม่</button></div>';
if(!S.roster.length)h+='<p class="mu">ยังไม่มีผู้เล่น</p>';
S.roster.forEach(function(n,i){var on=!S.off[n];h+='<div class="pl"><label class="row" style="flex:1;'+(on?'':'opacity:.45')+'"><input type="checkbox" style="width:22px;height:22px" '+(on?'checked':'')+' onchange="tog('+i+')"><span>'+esc(n)+'</span></label><span class="row"><span class="badge">'+(st.g[n]||0)+' เกม</span><button class="dg" onclick="rm('+i+')">ลบ</button></span></div>'});
h+='</div><div class="card"><b>จำนวนสนาม</b><div class="seg">';[1,2,3,4].forEach(function(c){h+='<button class="'+(S.courts===c?'on':'')+'" onclick="S.courts='+c+';save();render()">'+c+'</button>'});return h+'</div></div>'}
function tabMatch(){var st=stats(),h='<button class="big" onclick="gen()">🎲 สุ่มจับคู่รอบถัดไป</button><div style="height:12px"></div>';
if(!S.rounds.length)h+='<p class="mu">กดปุ่มเพื่อสร้างรอบแรก ระบบจะเลือกคนที่เล่นน้อยสุดก่อน และพยายามไม่ให้ซ้ำคู่เดิม</p>';
for(var i=S.rounds.length-1;i>=0;i--){var r=S.rounds[i];h+='<div class="card"><b>รอบที่ '+(i+1)+'</b>';r.matches.forEach(function(m,j){h+='<div class="m"><div class="mu">สนาม '+(j+1)+'</div><div class="vs"><div>'+esc(m.a[0])+'<br>'+esc(m.a[1])+'</div><span class="v">VS</span><div>'+esc(m.b[0])+'<br>'+esc(m.b[1])+'</div></div></div>'});
if(r.rest.length)h+='<div class="mu">พัก: '+r.rest.map(esc).join(', ')+'</div>';h+='</div>'}
if(S.rounds.length)h+='<button class="sec big" style="margin-bottom:8px" onclick="gen(true)">🔄 สุ่มรอบล่าสุดใหม่</button><div class="row"><button class="sec" style="flex:1" onclick="S.rounds.pop();save();render()">↩ ลบรอบล่าสุด</button><button class="dg" onclick="clr()">ล้างทั้งหมด</button></div>';return h}
function tabCost(){var st=stats(),names=allNames();var court=S.court.fixed!==''?num(S.court.fixed):num(S.court.price)*num(S.court.hours);var shut=num(S.shuttle.price)*num(S.shuttle.count);var total=court+shut;
var slots=0;names.forEach(function(n){slots+=st.g[n]||0});var useG=S.mode==='games'&&slots>0;
var h='<div class="card"><b>ค่าสนาม</b><div class="g2"><div><span class="lab">ราคา/ชม. (บาท)</span><input type="number" inputmode="decimal" value="'+S.court.price+'" oninput="S.court.price=this.value;S.court.fixed=\'\';upd()"></div><div><span class="lab">จำนวนชม.</span><input type="number" inputmode="decimal" value="'+S.court.hours+'" oninput="S.court.hours=this.value;S.court.fixed=\'\';upd()"></div></div><span class="lab">หรือกรอกยอดรวมค่าสนามเอง (ถ้ามี)</span><input type="number" inputmode="decimal" value="'+S.court.fixed+'" placeholder="เว้นว่างเพื่อคำนวณอัตโนมัติ" oninput="S.court.fixed=this.value;upd()"></div>';
h+='<div class="card"><b>ค่าลูกแบด</b><div class="g2"><div><span class="lab">ราคา/ลูก (บาท)</span><input type="number" inputmode="decimal" value="'+S.shuttle.price+'" oninput="S.shuttle.price=this.value;upd()"></div><div><span class="lab">จำนวนลูกที่ใช้</span><input type="number" inputmode="decimal" value="'+S.shuttle.count+'" oninput="S.shuttle.count=this.value;upd()"></div></div></div>';
h+='<div class="card"><b>วิธีหาร</b><div class="seg"><button class="'+(S.mode==='equal'?'on':'')+'" onclick="S.mode=\'equal\';save();render()">หารเท่ากัน</button><button class="'+(S.mode==='games'?'on':'')+'" onclick="S.mode=\'games\';save();render()">ตามจำนวนเกม</button></div></div>';
h+='<div id="res">'+resHtml(st,names,court,shut,total,useG,slots)+'</div>';return h}
function resHtml(st,names,court,shut,total,useG,slots){var h='<div class="card"><div class="mu">ยอดรวม (สนาม '+court.toLocaleString()+' + ลูก '+shut.toLocaleString()+')</div><div class="tot">'+total.toLocaleString()+' บาท</div></div><div class="card"><b>ยอดต่อคน</b>';
if(!names.length)h+='<p class="mu">ยังไม่มีผู้เล่น</p>';var sum=0;
names.forEach(function(n){var g=st.g[n]||0,amt=useG?total*g/slots:total/names.length;amt=Math.ceil(amt);sum+=amt;var pd=S.paid[n];h+='<div class="pl"><label class="row'+(pd?' paid':'')+'"><input type="checkbox" style="width:22px;height:22px" '+(pd?'checked':'')+' onchange="S.paid[\''+n.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')+'\']=this.checked;save();render()"><span>'+esc(n)+' <span class="mu">('+g+' เกม)</span></span></label><b>'+amt.toLocaleString()+' ฿</b></div>'});
return h+'<p class="mu">รวมเก็บ '+sum.toLocaleString()+' บาท (ปัดขึ้นเป็นบาทเต็ม) · ติ๊กเมื่อจ่ายแล้ว</p></div>'}
function upd(){save();var st=stats(),names=allNames();var court=S.court.fixed!==''?num(S.court.fixed):num(S.court.price)*num(S.court.hours);var shut=num(S.shuttle.price)*num(S.shuttle.count);var slots=0;names.forEach(function(n){slots+=st.g[n]||0});document.getElementById('res').innerHTML=resHtml(st,names,court,shut,court+shut,S.mode==='games'&&slots>0,slots)}
function render(){var T=['👥 ผู้เล่น','🏸 จับคู่','💰 ค่าใช้จ่าย'];document.getElementById('nav').innerHTML=T.map(function(t,i){return'<button class="'+(S.tab===i?'on':'')+'" onclick="S.tab='+i+';save();render()">'+t+'</button>'}).join('');document.getElementById('app').innerHTML=[tabPlayers,tabMatch,tabCost][S.tab]()}
render();
</script>
</body>
</html>
